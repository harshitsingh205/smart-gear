<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 512px;
    height: 512px;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2368BD"/>
      <stop offset="50%" stop-color="#1E56A0"/>
      <stop offset="100%" stop-color="#143F7A"/>
    </linearGradient>
    <radialGradient id="highlight" cx="30%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0A1E38" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded squircle (superellipse feel, 136px radius) -->
  <rect x="16" y="16" width="480" height="480" rx="136" fill="url(#blueGrad)" filter="url(#subtleShadow)"/>
  <rect x="16" y="16" width="480" height="480" rx="136" fill="url(#highlight)"/>
  <rect x="16" y="16" width="480" height="480" rx="136" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="2"/>

  <!-- Centered White Helmet Icon -->

    </g>
  </g>
</svg>
</body>
</html>
